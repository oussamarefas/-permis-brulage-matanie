<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="spiRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090000"/>
      <stop offset="45%" stop-color="#3b0000"/>
      <stop offset="100%" stop-color="#a00000"/>
    </linearGradient>
    <radialGradient id="softLight" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#spiRed)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#softLight)"/>
  <rect x="34" y="34" width="444" height="444" rx="86" fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="16"/>
  <image href="./Logo-SPI-Transparent.png" x="82" y="82" width="348" height="348" preserveAspectRatio="xMidYMid meet" filter="url(#shadow)"/>
</svg>
